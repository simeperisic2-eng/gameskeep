[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameskeep-ai"
version = "0.0.0"
description = "GamesKeep AI microservice (clustering, embeddings, bias assist)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Real, offline sentence embeddings for clustering (ONNX Runtime, NO torch).
  # all-MiniLM-L6-v2 → 384-dim, matching @gameskeep/shared EMBEDDING_DIM.
  "fastembed>=0.8,<0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

# fastembed ships no type stubs; isolate the dependency so the rest stays strict.
[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
